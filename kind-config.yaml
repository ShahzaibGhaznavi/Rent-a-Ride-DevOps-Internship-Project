kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rent-a-ride
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
