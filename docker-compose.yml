
services:
  mongodb:
    image: mongo:8.0
    container_name: rent-a-ride-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: rent_a_ride
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rent_a_ride_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rent-a-ride-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      mongo_uri: mongodb://mongodb:27017/rent_a_ride
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - rent_a_ride_network

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
    container_name: rent-a-ride-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - rent_a_ride_network

volumes:
  mongodb_data:
    name: rent-a-ride_mongodb_data

networks:
  rent_a_ride_network:
    name: rent-a-ride-network
    driver: bridge
