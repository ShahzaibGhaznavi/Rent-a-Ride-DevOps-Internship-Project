
services:
  mongodb:
    image: mongo:8.0
    container_name: rent-a-ride-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: rent_a_ride

    ports:
      - "27018:27017"

    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - rent_a_ride_network

  backend:
    image: shahzaibazeem/rent-a-ride-backend:${IMAGE_TAG:-task7-3}
    container_name: rent-a-ride-backend
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env}

    environment:
      mongo_uri: mongodb://mongodb:27017/rent_a_ride

    ports:
      - "3000:3000"

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/user/listAllVehicles').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - rent_a_ride_network

  frontend:
    image: shahzaibazeem/rent-a-ride-frontend:${IMAGE_TAG:-task7-3}
    container_name: rent-a-ride-frontend
    restart: unless-stopped

    ports:
      - "3001:8080"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - rent_a_ride_network

volumes:
  mongodb_data:
    name: rent-a-ride_mongodb_data

networks:
  rent_a_ride_network:
    name: rent-a-ride-network
    driver: bridge
