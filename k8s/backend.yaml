apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: rent-a-ride
data:
  mongo_uri: mongodb://mongodb:27017/rent_a_ride
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rent-a-ride
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rent-a-ride
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 332730082659.dkr.ecr.ap-south-1.amazonaws.com/rent-a-ride-backend:task9-1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
