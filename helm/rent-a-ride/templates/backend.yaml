apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  mongo_uri: {{ printf "mongodb://mongodb:%v/%s" .Values.mongodb.port .Values.mongodb.database | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: {{ .Values.backend.existingSecret }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            periodSeconds: 10
