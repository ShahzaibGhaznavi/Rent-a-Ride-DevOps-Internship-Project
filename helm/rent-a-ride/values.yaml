nameOverride: rent-a-ride
fullnameOverride: rent-a-ride

mongodb:
  image: mongo:8.0
  database: rent_a_ride
  port: 27017
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

backend:
  replicaCount: 1
  image:
    repository: 332730082659.dkr.ecr.ap-south-1.amazonaws.com/rent-a-ride-backend
    tag: task9-1
    pullPolicy: IfNotPresent
  port: 3000
  existingSecret: backend-secrets
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

frontend:
  replicaCount: 1
  image:
    repository: 332730082659.dkr.ecr.ap-south-1.amazonaws.com/rent-a-ride-frontend
    tag: task7-6
    pullPolicy: IfNotPresent
  containerPort: 8080
  servicePort: 80
  nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

ingress:
  enabled: true
  className: traefik
  annotations: {}
  paths:
    - path: /api
      pathType: Prefix
      service: backend
      port: 3000
    - path: /health
      pathType: Prefix
      service: backend
      port: 3000
    - path: /
      pathType: Prefix
      service: frontend
      port: 80
